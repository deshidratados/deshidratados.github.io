name: Copia de seguridad de la base de datos

# Copia semanal de la base de datos de Supabase, cifrada y guardada como
# artifact durante 30 días. En un repo público el artifact lo puede
# descargar cualquiera, POR ESO VA CIFRADO: sin la frase de cifrado no
# sirve de nada robarse el archivo (contiene datos de clientes).
#
# Además descarga las fotos del bucket "product-images" como segundo
# artifact. Esas van SIN cifrar a propósito: el bucket es público (las
# fotos se sirven por URL a cualquiera), cifrarlas solo añadiría lío a la
# restauración.
#
# Restauración:
#   - Base de datos:
#       openssl enc -d -aes-256-cbc -pbkdf2 -salt -pass pass:'TU_FRASE' \
#         -in solaria-AAAA-MM-DD.dump.enc \
#         | pg_restore --clean --if-exists --no-owner -d 'postgresql://...'
#   - Fotos: descomprime solaria-storage-AAAA-MM-DD.tar.gz y arrastra la
#     carpeta product-images al bucket "product-images" en el dashboard
#     de Supabase → Storage (el dashboard recrea las carpetas al soltarla).
#
# Requiere dos secrets (Settings → Secrets and variables → Actions):
#   BACKUP_DB_URL       URL de conexión de Supabase. En el dashboard →
#                       Connect → «Direct connection» (puerto 5432).
#   BACKUP_PASSPHRASE   Frase de cifrado que inventes tú. Apúntala en un
#                       sitio seguro: si la pierdes, las copias no se
#                       pueden restaurar.
#
# Para restaurar una copia (con el cliente pg_restore instalado):
#   openssl enc -d -aes-256-cbc -pbkdf2 -salt -pass pass:'TU_FRASE' \
#     -in solaria-AAAA-MM-DD.dump.enc \
#     | pg_restore --clean --if-exists --no-owner -d 'postgresql://...'
#
# Notas:
#   - «Run workflow» lanza una copia bajo demanda.
#   - Si el repo pasa 60 días sin actividad, GitHub desactiva los cron;
#     vuelve a activarlos en la pestaña Actions → Copia de seguridad.
on:
  schedule:
    - cron: '0 4 * * 1' # lunes 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # El cliente de la runner puede quedar por detrás de la versión del
      # servidor gestionado; instalamos la última desde el repositorio
      # oficial de PostgreSQL.
      - name: Instalar el cliente de PostgreSQL (última versión)
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y curl ca-certificates gnupg lsb-release
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            --fail --location https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -y
          sudo apt-get install -y postgresql-client

      - name: Volcado cifrado
        env:
          PG_URL: ${{ secrets.BACKUP_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "$PG_URL" ]; then echo "Falta el secret BACKUP_DB_URL"; exit 1; fi
          if [ -z "$BACKUP_PASSPHRASE" ]; then echo "Falta el secret BACKUP_PASSPHRASE"; exit 1; fi

          OUT="solaria-$(date -u +%F).dump.enc"
          OK=0
          # El proyecto gratuito se duerme tras unos días sin uso: la
          # primera conexión tarda; reintentamos un par de veces.
          for intento in 1 2 3; do
            if pg_dump --no-owner --no-privileges --format=custom "$PG_URL" \
              | openssl enc -aes-256-cbc -pbkdf2 -salt -pass pass:"$BACKUP_PASSPHRASE" \
              > "$OUT.tmp" && [ -s "$OUT.tmp" ]; then
              mv "$OUT.tmp" "$OUT"
              OK=1
              break
            fi
            echo "Reintento $intento fallido; espero 60 s…"
            sleep 60
          done
          if [ "$OK" != 1 ]; then
            echo "No se pudo hacer la copia tras 3 intentos."
            exit 1
          fi
          ls -la "$OUT"

      - name: Guardar la copia (artifact, 30 días)
        uses: actions/upload-artifact@v4
        with:
          name: solaria-backup
          path: solaria-*.dump.enc
          retention-days: 30
          if-no-files-found: error

      # Fotos del catálogo. El volcado de arriba ya incluye las FILAS de
      # storage.objects (qué fotos existen y cómo se llaman); aquí se
      # descarga el binario de cada una por la URL pública del bucket.
      # Así no hace falta ningún secret nuevo.
      - name: Fotos del catálogo (bucket product-images)
        env:
          PG_URL: ${{ secrets.BACKUP_DB_URL }}
        run: |
          set -euo pipefail

          # Ref del proyecto a partir de la URL de conexión
          # (db.adeytt…supabase.co o …-pooler.supabase.co → adeytt…).
          HOST=$(printf '%s' "$PG_URL" | sed -E 's#^[^@]*@##; s#[/:].*$##')
          case "$HOST" in
            db.*.supabase.co)     REF=${HOST#db.}; REF=${REF%%.supabase.co} ;;
            *-pooler.supabase.co) REF=${HOST%%-pooler*} ;;
            *)                    REF=$HOST ;;
          esac
          echo "Proyecto: $REF"

          psql "$PG_URL" -At -c \
            "select name from storage.objects where bucket_id = 'product-images' order by name" \
            > /tmp/fotos.txt
          TOTAL=$(grep -c . /tmp/fotos.txt || true)
          if [ "$TOTAL" -eq 0 ]; then
            echo "El bucket no tiene fotos; no se crea artifact de storage."
            exit 0
          fi
          echo "$TOTAL fotos en el bucket"

          mkdir -p product-images
          OK=0
          FALLO=0
          while IFS= read -r NAME; do
            [ -n "$NAME" ] || continue
            ENC=$(jq -nr --arg v "$NAME" '$v|@uri')
            DEST="product-images/$NAME"
            mkdir -p "$(dirname "$DEST")"
            if curl -fsSL --retry 3 --retry-delay 10 \
              "https://$REF.supabase.co/storage/v1/object/public/product-images/$ENC" \
              -o "$DEST"; then
              OK=$((OK + 1))
            else
              echo "No se pudo descargar: $NAME"
              FALLO=$((FALLO + 1))
            fi
          done < /tmp/fotos.txt

          echo "Descargadas: $OK · Fallidas: $FALLO de $TOTAL"
          tar -czf "solaria-storage-$(date -u +%F).tar.gz" product-images
          # Las fallidas no rompen el paso: la copia de la base (lo
          # realmente delicado) ya está guardada; se avisa en el log.

      - name: Guardar las fotos (artifact, 30 días)
        uses: actions/upload-artifact@v4
        with:
          name: solaria-storage
          path: solaria-storage-*.tar.gz
          retention-days: 30
          if-no-files-found: warn
